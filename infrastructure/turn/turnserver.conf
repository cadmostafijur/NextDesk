# coturn configuration for NexDesk (development template)
# Production: set a strong static-auth-secret matching NEXDESK_TURN_SECRET

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=replace-turn-shared-secret
realm=nexdesk.local
total-quota=100
bps-capacity=0
stale-nonce=600
no-multicast-peers
no-cli

# Restrict relays in production to your public IP / interface
# external-ip=YOUR.PUBLIC.IP
# relay-ip=YOUR.PUBLIC.IP
